<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitApp</title>
<meta name="description" content="Registrá tus entrenamientos. Funciona sin señal.">

<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="estilos.css">

<!-- iOS ignora buena parte del manifest. Estas son las que hacen que, al agregarla a la
     pantalla de inicio en iPhone, abra sin la barra de Safari. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitApp">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#0f1115">
</head>
<body>

<div id="cargando" class="cargando">Cargando…</div>

<div id="error" class="error-fatal" hidden></div>

<main id="app" hidden>
  <!-- Pantalla 1 · Elegir qué entrenar hoy -->
  <section id="pantalla-hoy" class="pantalla"></section>

  <!-- Pantalla 2 · La sesión en curso. Es la que importa. -->
  <section id="pantalla-sesion" class="pantalla" hidden></section>

  <!-- Pantalla 3 · Historial -->
  <section id="pantalla-historial" class="pantalla" hidden></section>
</main>

<nav id="navegacion" class="nav" hidden>
  <button type="button" data-ir="hoy" class="nav-boton activo">Hoy</button>
  <button type="button" data-ir="historial" class="nav-boton">Historial</button>
</nav>

<script type="module" src="app.js"></script>
</body>
</html>
